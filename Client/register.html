<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <title>CrapChat - Register</title>

    <link href="styles/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body class="loginWindow">
    <div class="loginPanel">
        <form class="loginForm">
            <div class="loginPanelTitle">
                <p>CREATE ACCOUNT</p>
                <span class="loginSubtitle">Join CrapChat - enter your details below.</span>
            </div>

            <div class="input-wrapper">
                <i class="fa-solid fa-user input-icon"></i>
                <input class="login-input" type="text" placeholder="Username">
            </div>

            <div class="input-wrapper">
                <i class="fa-solid fa-lock input-icon"></i>
                <input class="login-input" type="password" placeholder="Password">
            </div>

            <div class="input-wrapper">
                <i class="fa-solid fa-ticket input-icon"></i>
                <input class="login-input" type="password" placeholder="Invitation Code">
            </div>

            <button class="login-button" type="submit" id="register-button">REGISTER</button>

            <div class="loginLinks loginLinks-single">
                <a href="index.html">Already have an account? Login</a>
            </div>
        </form>
    </div>
</body>
</html>
